pr: 0
entries:
  - category: feature
    text: Added independent Attention/MLP branch ablations, per-position and Target-prefix diagnostics, and an offline Target-KV calibration tool with budgeted joint-mask search, held-out evaluation and per-token Target-KV refresh controls. Searched masks are reported as candidates and are never applied automatically.
  - category: feature
    text: Added opt-in Slim Verifier shadow evaluation for dense Qwen2/Qwen3 targets on Model Runner V2, with shared weights and read-only Target prefix KV by default (kv_source=target). The reduced model computes only the current query; full-history replay remains available with kv_source=replay. Window/cumulative diagnostics support Top-1 matching or configurable probability ratios, first-token acceptance, and logit differences. Shadow results do not participate in speculative sampling decisions.
